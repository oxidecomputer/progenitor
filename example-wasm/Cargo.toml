[package]
name = "example-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
progenitor-client = { path = "../progenitor-client" }
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.66"

[build-dependencies]
prettyplease = "0.3.0"
progenitor = { path = "../progenitor" }
serde_json = "1.0"
syn = "3.0"
